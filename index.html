<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你不要过来啊 · 步惊云惊吓模拟器</title>
<link rel="icon" href="https://fav.farm/☁️" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18120d;
    --red:#8b1a1a;
    --red-deep:#4a0d0d;
    --gold:#d4af37;
    --gold-soft:#eccd7a;
    --jade:#2e8b7a;
    --magenta:#ff2e88;
    --parchment:#f2e8d5;
    --level-pct:0%;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    overflow:hidden;
    font-family:'Noto Sans SC',sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:5vh 4vw 3vh;
    isolation:isolate;
  }

  /* ---------- 水墨背景 ---------- */
  .ink-bg{
    position:absolute;
    inset:0;
    z-index:-3;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(139,26,26,0.55), transparent 60%),
      radial-gradient(ellipse 50% 45% at 85% 80%, rgba(74,13,13,0.65), transparent 65%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(212,175,55,0.10), transparent 70%),
      linear-gradient(180deg, #1c140f 0%, #100b08 100%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(6deg) brightness(1.06); }
  }

  .frame-border{
    position:absolute;
    inset:14px;
    border:2px solid var(--gold);
    z-index:5;
    pointer-events:none;
    opacity:0.55;
  }
  .frame-border::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--gold-soft);
    opacity:0.4;
  }
  .corner{
    position:absolute;
    width:22px;height:22px;
    border:2px solid var(--gold);
    z-index:6;
    opacity:.8;
  }
  .corner.tl{top:6px;left:6px;border-right:none;border-bottom:none;}
  .corner.tr{top:6px;right:6px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:6px;left:6px;border-right:none;border-top:none;}
  .corner.br{bottom:6px;right:6px;border-left:none;border-top:none;}

  .flash-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    pointer-events:none;
    opacity:0;
    background:var(--magenta);
    mix-blend-mode:screen;
  }
  .flash-overlay.hit{
    animation:flashpop .28s ease-out;
  }
  @keyframes flashpop{
    0%{opacity:0;}
    18%{opacity:.35;}
    100%{opacity:0;}
  }

  /* ---------- 标题区 ---------- */
  .eyebrow{
    letter-spacing:.4em;
    font-size:.72rem;
    color:var(--gold-soft);
    margin:0 0 6px;
    text-transform:uppercase;
    opacity:.85;
  }
  .title{
    font-family:'Ma Shan Zheng',cursive;
    font-size:clamp(3rem, 10vw, 6rem);
    color:var(--parchment);
    margin:0;
    line-height:1;
    text-shadow:
      3px 3px 0 var(--red-deep),
      6px 6px 14px rgba(0,0,0,.55),
      0 0 30px rgba(212,175,55,.25);
    text-align:center;
  }
  .subtitle{
    margin:10px 0 0;
    font-size:clamp(.85rem,2vw,1rem);
    color:var(--gold-soft);
    opacity:.85;
    text-align:center;
    min-height:1.4em;
  }

  /* ---------- 步惊云本尊 ---------- */
  .figure-wrap{
    position:relative;
    margin:2.2vh 0 1.4vh;
    width:min(46vw, 260px);
    height:min(46vw, 260px);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .glow{
    position:absolute;
    inset:-20%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(139,26,26,.55), transparent 70%);
    filter:blur(10px);
    transform:scale(var(--glow-scale,1));
    transition:transform .25s ease;
    z-index:0;
  }
  .figure{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:block;
    transition:transform .15s ease;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
  }
  .figure-wrap:hover .figure{ transform:scale(1.03); }
  .figure-wrap:active .figure{ transform:scale(.97); }
  .figure-wrap.scared .figure{
    animation:jolt .35s ease;
  }
  @keyframes jolt{
    0%{transform:rotate(0deg) scale(1);}
    20%{transform:rotate(-4deg) scale(1.05);}
    45%{transform:rotate(3deg) scale(.97);}
    70%{transform:rotate(-2deg) scale(1.03);}
    100%{transform:rotate(0deg) scale(1);}
  }

  /* ---------- 惊吓值面板 ---------- */
  .meter-panel{
    width:min(90vw, 420px);
    text-align:center;
  }
  .meter-label{
    font-weight:900;
    color:var(--parchment);
    letter-spacing:.06em;
    margin-bottom:6px;
    font-size:.95rem;
  }
  .meter-track{
    width:100%;
    height:14px;
    border:1.5px solid var(--gold);
    border-radius:8px;
    background:rgba(0,0,0,.35);
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width:var(--level-pct);
    background:linear-gradient(90deg, var(--jade), var(--gold) 55%, var(--red) 100%);
    transition:width .3s ease;
  }
  .count-label{
    margin-top:8px;
    font-size:.85rem;
    color:var(--gold-soft);
    opacity:.9;
  }
  .count-label span{
    color:var(--parchment);
    font-weight:900;
  }

  /* ---------- 按钮 ---------- */
  .btn-row{
    display:flex;
    gap:14px;
    margin-top:2.2vh;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:'Noto Sans SC',sans-serif;
    font-weight:900;
    font-size:.95rem;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .trigger-btn{
    background:linear-gradient(135deg, var(--red), var(--red-deep));
    color:var(--parchment);
    border:1.5px solid var(--gold);
    box-shadow:0 4px 14px rgba(139,26,26,.4);
  }
  .trigger-btn:hover{ filter:brightness(1.12); }
  .trigger-btn:focus-visible, .reset-btn:focus-visible, .audio-loader label:focus-within{
    outline:2px solid var(--gold-soft);
    outline-offset:3px;
  }
  .reset-btn{
    background:transparent;
    color:var(--gold-soft);
    border:1.5px solid var(--gold-soft);
  }
  .reset-btn:hover{ background:rgba(212,175,55,.12); }

  /* ---------- 音效加载区 ---------- */
  .audio-loader{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    z-index:7;
    max-width:92vw;
  }
  .audio-loader label{
    font-size:.75rem;
    color:var(--gold-soft);
    border:1px dashed var(--gold-soft);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    opacity:.85;
  }
  .audio-loader label:hover{ opacity:1; }
  .audio-loader input{ display:none; }
  .audio-status{
    font-size:.68rem;
    color:rgba(242,232,213,.55);
    text-align:center;
  }

  /* ---------- 弹幕层 ---------- */
  .danmaku-layer{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    overflow:hidden;
  }
  .danmaku{
    position:absolute;
    right:-10%;
    white-space:nowrap;
    font-weight:900;
    -webkit-text-stroke:1.6px #000;
    text-shadow:0 0 6px rgba(0,0,0,.6);
    will-change:transform;
  }
  @keyframes flyby{
    from{ transform:translateX(0); }
    to{ transform:translateX(-130vw); }
  }

  /* ---------- 屏幕震动 ---------- */
  .stage.shake{ animation:shakeit .32s ease; }
  @keyframes shakeit{
    0%{transform:translate(0,0);}
    20%{transform:translate(-6px,3px) rotate(-.4deg);}
    40%{transform:translate(5px,-4px) rotate(.3deg);}
    60%{transform:translate(-4px,4px) rotate(-.3deg);}
    80%{transform:translate(3px,-2px) rotate(.2deg);}
    100%{transform:translate(0,0);}
  }

  @media (prefers-reduced-motion: reduce){
    .ink-bg{ animation:none; }
    .stage.shake{ animation:none; }
    .figure-wrap.scared .figure{ animation:none; }
    .flash-overlay.hit{ animation:none; opacity:.15; }
  }

  @media (max-width:480px){
    .figure-wrap{ width:52vw; height:52vw; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="ink-bg"></div>
    <div class="frame-border"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="flash-overlay" id="flashOverlay"></div>

    <p class="eyebrow">风云 · 江湖鬼畜档案</p>
    <h1 class="title">你不要过来啊</h1>
    <p class="subtitle" id="subtitleText">江湖风云乍起，步惊云满怀戒备……</p>

        <path d="M80 34 C90 26 110 26 120 34" stroke="var(--red)" stroke-width="4" fill="none" stroke-linecap="round"/>

        <path d="M88 44 L96 40" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
        <path d="M112 44 L104 40" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="91" cy="49" rx="2.4" ry="3.2" fill="var(--parchment)"/>
        <ellipse cx="109" cy="49" rx="2.4" ry="3.2" fill="var(--parchment)"/>
        <path d="M92 58 Q100 52 108 58" stroke="var(--gold-soft)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="meter-panel">
      <div class="meter-label" id="meterLabel">惊吓值：淡定</div>
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      <div class="count-label">步惊云已经喊了 <span id="countNum">0</span> 次</div>
    </div>

    <div class="btn-row">
      <button class="trigger-btn" id="triggerBtn">点我惊吓步惊云</button>
      <button class="reset-btn" id="resetBtn">重置江湖</button>
    </div>

    <div class="audio-loader">
      <label for="audioInput">🎵 已内置"你不要过来啊"音效，点此可替换</label>
      <input type="file" id="audioInput" accept="audio/*">
      <span class="audio-status" id="audioStatus">点击步惊云即可播放</span>
    </div>

    <div class="danmaku-layer" id="danmakuLayer"></div>
  </div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const figureWrap = document.getElementById('figureWrap');
  const glow = document.getElementById('glow');
  const flashOverlay = document.getElementById('flashOverlay');
  const meterLabel = document.getElementById('meterLabel');
  const meterFill = document.getElementById('meterFill');
  const countNum = document.getElementById('countNum');
  const subtitleText = document.getElementById('subtitleText');
  const triggerBtn = document.getElementById('triggerBtn');
  const resetBtn = document.getElementById('resetBtn');
  const audioInput = document.getElementById('audioInput');
  const audioStatus = document.getElementById('audioStatus');
  const sfx = document.getElementById('sfx');
  const danmakuLayer = document.getElementById('danmakuLayer');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let count = 0;
  let audioLoaded = true;
  let audioCtx = null;

  const phrases = ["你不要过来啊", "别过来！！", "啊啊啊别过来", "江湖告急", "求你别过来"];
  const danmakuColors = ["#f2e8d5", "#eccd7a", "#ff8fbf"];

  const levels = [
    { min:0,  label:"淡定",        sub:"江湖风云乍起，步惊云满怀戒备……" },
    { min:3,  label:"微微戒备",     sub:"有人正在靠近，步惊云开始不安" },
    { min:7,  label:"河东狮吼预警", sub:"空气中弥漫着不祥的气息" },
    { min:13, label:"鬼畜结界开启", sub:"结界已经压不住了！！" },
    { min:20, label:"弹幕警告：勿靠近", sub:"弹幕如潮水般涌来" },
    { min:30, label:"江湖已沦陷",   sub:"退无可退，只能靠喊了" }
  ];

  function currentLevel(){
    let idx = 0;
    for(let i=0;i<levels.length;i++){ if(count>=levels[i].min) idx=i; }
    return idx;
  }

  function updateMeter(){
    const idx = currentLevel();
    const info = levels[idx];
    meterLabel.textContent = "惊吓值：" + info.label;
    subtitleText.textContent = info.sub;
    countNum.textContent = count;
    const pct = Math.min(count/40,1)*100;
    meterFill.style.setProperty('--w', pct+'%');
    meterFill.style.width = pct+'%';
    glow.style.setProperty('--glow-scale', (1 + Math.min(count,25)*0.02).toFixed(2));
    return idx;
  }

  function playFallbackTone(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(90, now+0.35);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now+0.42);
    }catch(e){ /* audio unavailable, ignore */ }
  }

  function playSound(){
    if(audioLoaded){
      try{
        sfx.currentTime = 0;
        sfx.play();
      }catch(e){ playFallbackTone(); }
    } else {
      playFallbackTone();
    }
  }

  function spawnDanmaku(level){
    const lanes = Math.min(1 + Math.floor(level/1.4), 5);
    for(let i=0;i<lanes;i++){
      const el = document.createElement('div');
      el.className = 'danmaku';
      el.textContent = phrases[Math.floor(Math.random()*phrases.length)];
      const size = 1 + Math.random()*1.6 + level*0.12;
      el.style.fontSize = size.toFixed(2)+'rem';
      el.style.top = (6 + Math.random()*82) + 'vh';
      el.style.color = danmakuColors[Math.floor(Math.random()*danmakuColors.length)];
      const duration = reduceMotion ? 2.6 : Math.max(1.4, 3.4 - level*0.18);
      el.style.animation = 'flyby ' + duration.toFixed(2) + 's linear forwards';
      danmakuLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  function flash(){
    if(reduceMotion) return;
    const colors = ['#ff2e88', '#d4af37', '#8b1a1a', '#2e8b7a'];
    flashOverlay.style.background = colors[Math.floor(Math.random()*colors.length)];
    flashOverlay.classList.remove('hit');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('hit');
  }

  function shakeScreen(){
    if(reduceMotion) return;
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
  }

  function scare(){
    count++;
    const level = updateMeter();
    playSound();
    flash();
    shakeScreen();
    spawnDanmaku(level);
    figureWrap.classList.remove('scared');
    void figureWrap.offsetWidth;
    figureWrap.classList.add('scared');
  }

  function reset(){
    count = 0;
    updateMeter();
    danmakuLayer.innerHTML = '';
    subtitleText.textContent = levels[0].sub;
  }

  figureWrap.addEventListener('click', scare);
  figureWrap.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); scare(); }
  });
  triggerBtn.addEventListener('click', scare);
  resetBtn.addEventListener('click', reset);

  audioInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    sfx.src = url;
    audioLoaded = true;
    audioStatus.textContent = '已加载："' + file.name + '"，点击步惊云试试！';
  });

  updateMeter();
})();
</script>
</body>
